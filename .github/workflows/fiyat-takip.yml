name: Fiyat Takip

on:
  schedule:
    - cron: "*/5 * * * *"    # yedek: zincir koparsa yeniden başlatır
  workflow_dispatch:          # her çalışma bitince bir sonrakini kendisi başlatır

permissions:
  contents: write
  actions: write

concurrency:
  group: fiyat-takip
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mesajları işle ve fiyatları kontrol et
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_EKLE: ${{ secrets.NTFY_EKLE }}
          NTFY_BILDIRIM: ${{ secrets.NTFY_BILDIRIM }}
          KONTROL_DAKIKA: "5"
        run: python bot.py
      - name: Listeyi kaydet
        run: |
          git config user.name "fiyat-takip-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/urunler.json
          git diff --cached --quiet || (git commit -m "Fiyat listesi güncellendi" && git push)
      - name: 4 dakika bekle ve bir sonraki çalışmayı başlat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 240
          gh workflow run fiyat-takip.yml -R "${{ github.repository }}" --ref main
